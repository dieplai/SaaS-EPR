# ============================================
# Service Availability Alerts
# ============================================
# Alert when critical services are down
# ============================================

groups:
  - name: service_availability
    interval: 30s
    rules:
      # Backend API down
      - alert: BackendServiceDown
        expr: up{job="epr-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend API is down"
          description: "Backend API service has been unavailable for more than 2 minutes"

      # Chatbot API down
      - alert: ChatbotServiceDown
        expr: up{job="epr-chatbot"} == 0
        for: 2m
        labels:
          severity: critical
          service: chatbot
        annotations:
          summary: "Chatbot API is down"
          description: "Chatbot API service has been unavailable for more than 2 minutes"

      # Node exporter down
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Node Exporter is down"
          description: "Cannot collect system metrics - Node Exporter has been down for 5 minutes"

  - name: service_health
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      # Slow response time
      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time detected"
          description: "95th percentile response time is {{ $value }}s (threshold: 2s)"
