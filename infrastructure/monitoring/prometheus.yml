# ============================================
# Prometheus Configuration
# ============================================
# Scrapes metrics from services and exporters
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'epr-saas'
    environment: '${DEPLOY_ENV:-development}'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vps-server'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vps-server'

  # Backend service (if metrics endpoint available)
  - job_name: 'epr-backend'
    static_configs:
      - targets: ['epr-backend:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Chatbot service (if metrics endpoint available)
  - job_name: 'epr-chatbot'
    static_configs:
      - targets: ['ai-chatbot-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL Exporter (optional - add if needed)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis Exporter (optional - add if needed)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
