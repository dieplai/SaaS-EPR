# ============================================
# EPR SaaS - PRODUCTION ENVIRONMENT OVERRIDE
# ============================================
# Production-specific configuration
# Runs alongside staging with different ports
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.prod.yml -f docker-compose.production.yml up
# ============================================
# NOTE: Infrastructure (postgres/redis) is NOT included in base.yml
#       They are managed separately via docker-compose.infrastructure.yml
# ============================================

services:
  # ============================================
  # BACKEND - Production ports & name
  # ============================================
  epr-backend:
    container_name: epr-backend-prod
    ports:
      - "8101:8001"  # Host:Container

  # ============================================
  # CHATBOT - Production ports & name
  # ============================================
  ai-chatbot-api:
    container_name: epr-ai-chatbot-prod
    ports:
      - "8100:8000"  # Host:Container

  # ============================================
  # FRONTEND - Production ports & name
  # ============================================
  web-frontend:
    container_name: epr-web-frontend-prod
    ports:
      - "3100:3000"  # Host:Container
    # Note: VITE_ environment vars are baked into image at build time, not runtime
