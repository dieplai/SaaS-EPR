# ============================================
# EPR SaaS - BASE APPLICATION SERVICES
# ============================================
# This file defines ONLY application services (backend, chatbot, frontend)
# Infrastructure (postgres, redis) is managed separately
# Used as base for staging and production deployments
# ============================================

services:
  # ============================================
  # BACKEND SERVICE (Go - DDD Structure)
  # ============================================
  epr-backend:
    build:
      context: ./backend/services/epr-backend
      dockerfile: Dockerfile
    container_name: epr-backend
    # Ports defined in environment-specific overrides (staging.yml, production.yml)
    environment:
      - PORT=8001
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-epr_saas}?sslmode=disable
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION_MINUTES=${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      - JWT_REFRESH_EXPIRATION_HOURS=${JWT_REFRESH_EXPIRATION_HOURS:-168}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    networks:
      - epr-network
    restart: unless-stopped

  # ============================================
  # AI CHATBOT API (Python - RAG + LangChain - FastAPI)
  # ============================================
  ai-chatbot-api:
    build:
      context: ./backend/services/epr-chatbot-service
      dockerfile: Dockerfile
    container_name: epr-ai-chatbot-api
    # Ports defined in environment-specific overrides (staging.yml, production.yml)
    environment:
      - ENVIRONMENT=${NODE_ENV:-development}
      - DEBUG=${DEBUG:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_QDRANT_CLOUD=${USE_QDRANT_CLOUD:-false}
      - QDRANT_CLOUD_URL=${QDRANT_CLOUD_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-epr_saas}?sslmode=disable
      - REDIS_URL=${REDIS_URL}
      - EPR_BACKEND_URL=http://epr-backend:8001
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - chatbot_data:/app/qdrant_faq_db
    networks:
      - epr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "fastapi_server:app", "--host", "0.0.0.0", "--port", "8000"]

  # ============================================
  # FRONTEND WEB (Next.js)
  # ============================================
  web-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BROWSER_API_URL: ${NEXT_PUBLIC_BROWSER_API_URL:-http://localhost:8001/api/v1}
        NEXT_PUBLIC_BROWSER_CHATBOT_URL: ${NEXT_PUBLIC_BROWSER_CHATBOT_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    container_name: epr-web-frontend
    # Ports defined in environment-specific overrides (staging.yml, production.yml)
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://epr-backend:8001/api/v1
      - NEXT_PUBLIC_CHATBOT_API_URL=http://ai-chatbot-api:8000
      - NEXT_PUBLIC_BROWSER_API_URL=http://localhost:8001/api/v1
      - NEXT_PUBLIC_BROWSER_CHATBOT_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=EPR SaaS Platform
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
    networks:
      - epr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# NETWORKS
# ============================================
networks:
  epr-network:
    external: true  # Use existing network created by infrastructure
    name: epr-network

# ============================================
# VOLUMES
# ============================================
volumes:
  chatbot_data:
    external: true  # Use existing volume created by infrastructure
    name: epr_chatbot_data
