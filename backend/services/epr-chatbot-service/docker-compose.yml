version: '3.8'

services:
  # EPR Chatbot Service
  epr-chatbot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epr-chatbot-service
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=epr-chatbot-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8002
      - API_PREFIX=/api/v1
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=epr-documents
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - EPR_BACKEND_URL=http://epr-backend:8001
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost:3001
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - qdrant
    networks:
      - epr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant_faq_db:/qdrant/snapshots
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    networks:
      - epr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  qdrant_storage:
    driver: local

networks:
  epr-network:
    driver: bridge
