# ============================================
# Grafana Dashboard Provisioning
# ============================================
# Auto-load dashboards from files
# ============================================

apiVersion: 1

providers:
  - name: 'EPR SaaS Dashboards'
    orgId: 1
    folder: 'EPR SaaS'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/files
