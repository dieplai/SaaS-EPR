# ============================================
# EPR SaaS Platform - PRODUCTION Environment
# Domain: epr.dieplai.io.vn
# Ports: Backend=8101, Chatbot=8100, Frontend=3100
# ============================================
# Self-contained config - no external dependencies
# Safe to copy/modify for new projects
# ============================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name epr.dieplai.io.vn;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name epr.dieplai.io.vn;

    # ============================================
    # SSL Configuration
    # ============================================
    ssl_certificate /etc/letsencrypt/live/epr.dieplai.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epr.dieplai.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ============================================
    # Logging
    # ============================================
    access_log /var/log/nginx/production.epr.access.log;
    error_log /var/log/nginx/production.epr.error.log;

    # ============================================
    # Backend API - /api/*
    # ============================================
    location /api/ {
        # Proxy to backend container (frontend already includes /v1)
        proxy_pass http://localhost:8101;

        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for REST API
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # Chatbot API - /chat/api/*
    # ============================================
    location /chat/api/ {
        # Strip /chat prefix before proxying to chatbot container
        # /chat/api/v1/conversations -> /api/v1/conversations
        rewrite ^/chat(/api/.*)$ $1 break;
        proxy_pass http://localhost:8100;

        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for AI processing
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ============================================
    # Chatbot Streaming - /chat/stream
    # ============================================
    location /chat/stream {
        proxy_pass http://localhost:8100/chat/stream;

        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-specific settings
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ============================================
    # WebSocket - /chat/ws
    # ============================================
    location /chat/ws {
        # Rewrite to backend WebSocket path
        rewrite ^/chat/ws/(.*) /ws/$1 break;

        proxy_pass http://localhost:8100;

        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Frontend Application - /
    # ============================================
    location / {
        proxy_pass http://localhost:3100;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for HMR (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
