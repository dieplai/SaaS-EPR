# ============================================
# EPR SaaS - STAGING ENVIRONMENT OVERRIDE
# ============================================
# Staging-specific configuration
# Runs alongside production with different ports
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.staging.yml up
# ============================================
# NOTE: postgres and redis services are NOT defined here
#       They are managed separately and shared between staging and production
# ============================================

services:
  # ============================================
  # BACKEND - Staging container name & port
  # ============================================
  epr-backend:
    container_name: epr-backend
    ports:
      - "8001:8001"  # Staging uses default port 8001
    depends_on: []  # Override to remove postgres/redis dependencies

  # ============================================
  # CHATBOT - Staging container name & port
  # ============================================
  ai-chatbot-api:
    container_name: epr-ai-chatbot-api
    ports:
      - "8000:8000"  # Staging uses default port 8000
    depends_on: []  # Override to remove postgres/redis dependencies

  # ============================================
  # FRONTEND - Staging container name & port
  # ============================================
  web-frontend:
    container_name: epr-web-frontend
    ports:
      - "3000:3000"  # Staging uses default port 3000
    depends_on: []  # Override to remove dependencies
    # Note: NEXT_PUBLIC_ vars are baked into image at build time, not runtime
