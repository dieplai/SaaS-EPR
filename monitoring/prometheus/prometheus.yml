# ============================================
# PROMETHEUS CONFIGURATION
# ============================================
# Scrape configs for all services
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'epr-saas'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # ============================================
  # PROMETHEUS SELF-MONITORING
  # ============================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ============================================
  # NODE EXPORTER - Server Metrics
  # ============================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'epr-saas-server'

  # ============================================
  # CADVISOR - Container Metrics
  # ============================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ============================================
  # POSTGRES EXPORTER - Database Metrics
  # ============================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          database: 'postgres'

  # ============================================
  # REDIS EXPORTER - Cache Metrics
  # ============================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          instance: 'epr-redis'

  # ============================================
  # BACKEND API - Application Metrics
  # ============================================
  - job_name: 'epr-backend-staging'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['epr-backend:8001']
        labels:
          service: 'backend'
          environment: 'staging'

  - job_name: 'epr-backend-production'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['epr-backend-prod:8001']
        labels:
          service: 'backend'
          environment: 'production'

  # ============================================
  # CHATBOT API - Application Metrics
  # ============================================
  - job_name: 'chatbot-staging'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['epr-ai-chatbot-api:8000']
        labels:
          service: 'chatbot'
          environment: 'staging'

  - job_name: 'chatbot-production'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['epr-ai-chatbot-prod:8000']
        labels:
          service: 'chatbot'
          environment: 'production'

  # ============================================
  # GRAFANA - Dashboard Metrics
  # ============================================
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
