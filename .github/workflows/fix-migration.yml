name: Fix Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to fix'
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  fix-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Migration on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
          POSTGRES_PASSWORD: ${{ secrets[format('{0}_POSTGRES_PASSWORD', github.event.inputs.environment == 'staging' && 'STAGING' || 'PROD')] }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_ENV,POSTGRES_PASSWORD
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH || '/opt/epr-saas' }}

            # Pull latest code
            git fetch origin
            git reset --hard origin/main

            # Make script executable
            chmod +x infrastructure/scripts/db/force-run-migration-3.sh

            # Export password for script
            export POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"

            # Run fix script
            ./infrastructure/scripts/db/force-run-migration-3.sh
