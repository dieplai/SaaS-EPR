# ============================================
# EPR Legal SaaS - PRODUCTION OVERRIDE
# ============================================
# This file overrides docker-compose.yml for production
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# ============================================

services:
  # ============================================
  # BACKEND - Pull from GHCR
  # ============================================
  epr-backend:
    image: ghcr.io/dieplai/saas-epr-backend:${DEPLOY_ENV:-staging}
    build: null  # Disable build, use pre-built image

  # ============================================
  # CHATBOT - Pull from GHCR
  # ============================================
  ai-chatbot-api:
    image: ghcr.io/dieplai/saas-epr-chatbot:${DEPLOY_ENV:-staging}
    build: null

  ai-chatbot-ui:
    image: ghcr.io/dieplai/saas-epr-chatbot:${DEPLOY_ENV:-staging}
    build: null

  # ============================================
  # WEB FRONTEND - Pull from GHCR
  # ============================================
  web-frontend:
    image: ghcr.io/dieplai/saas-epr-web:${DEPLOY_ENV:-staging}
    build: null
    ports:
      - "3000:3000"  # Expose to host for NGINX native to proxy
    environment:
      # Override browser URLs for staging (accessed via NGINX)
      - NEXT_PUBLIC_BROWSER_API_URL=https://staging.epr.dieplai.io.vn/api
      - NEXT_PUBLIC_BROWSER_CHATBOT_URL=https://staging.epr.dieplai.io.vn/chat
      - NEXT_PUBLIC_APP_URL=https://staging.epr.dieplai.io.vn
